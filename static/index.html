<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoReel AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><b>AutoReel AI</b><span id="who"></span></header><main>
<section id="auth" class="card"><h1>Create Instagram Reels with AI</h1><p>Generate, approve, schedule and publish through an official integration.</p><div class="grid"><form id="register"><h2>Register</h2><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Register</button></form><form id="login"><h2>Login</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form></div></section>
<section id="app" hidden><div class="grid"><form id="brand" class="card"><h2>Brand profile</h2><input name="brand_name" placeholder="Brand name" value="IBaseIT Careers" required><input name="primary_genre" value="AI + Career" required><input name="target_audience" value="Indian IT professionals" required><input name="country" value="India" required><input name="language" value="English" required><input name="tone" value="Professional" required><input name="objective" value="Grow followers" required><select name="preferred_duration"><option value="30">30 seconds</option></select><textarea name="topics_include" placeholder="Topics to include"></textarea><textarea name="topics_exclude" placeholder="Topics to exclude"></textarea><button>Save profile</button></form><div class="card"><h2>Generator</h2><p>The runnable MVP uses a safe mock provider and renders a real MP4 through FFmpeg.</p><button id="generate">Generate Reel</button><button class="secondary" id="logout">Logout</button><div id="status"></div></div></div><h2>Your Reels</h2><div id="reels" class="reels"></div></section>
</main><script src="/static/app.js"></script></body></html>
